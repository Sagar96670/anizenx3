<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ANIZENX - Anime Streaming Player</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0b0b14;
      color: #f3f4f6;
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    .player-wrapper {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    .info-bar {
      background: #121222;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 0.6rem 1rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.85rem;
    }
    .info-title {
      font-weight: 700;
      color: #fff;
    }
    .info-meta {
      color: #a855f7;
      margin: 0 0.4rem;
    }
    .badge {
      background: rgba(139, 92, 246, 0.2);
      color: #d8b4fe;
      border: 1px solid rgba(139, 92, 246, 0.4);
      padding: 0.2rem 0.6rem;
      border-radius: 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .video-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 1rem;
      border: 1px solid rgba(139, 92, 246, 0.4);
      box-shadow: 0 20px 40px rgba(11, 11, 20, 0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(2px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 20;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(168, 85, 247, 0.2);
      border-top-color: #c084fc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .controls-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(8,8,18,0.95), transparent);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      z-index: 30;
      transition: opacity 0.3s;
    }
    .btn {
      background: rgba(139, 92, 246, 0.2);
      color: #e9d5ff;
      border: 1px solid rgba(139, 92, 246, 0.4);
      padding: 0.4rem 0.8rem;
      border-radius: 0.5rem;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: all 0.2s;
      text-decoration: none;
    }
    .btn:hover {
      background: rgba(168, 85, 247, 0.4);
      color: #fff;
    }
    .btn-gradient {
      background: linear-gradient(135deg, #a855f7, #ec4899);
      color: #fff;
      border: none;
      box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
    }
    .btn-gradient:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }
    /* Download Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }
    .modal-card {
      background: #121222;
      border: 1px solid rgba(168, 85, 247, 0.4);
      border-radius: 1.5rem;
      width: 100%;
      max-width: 440px;
      padding: 1.25rem;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(139, 92, 246, 0.2);
      padding-bottom: 0.75rem;
    }
    .modal-title {
      font-size: 0.95rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .close-btn {
      background: none;
      border: none;
      color: #9ca3af;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .close-btn:hover {
      color: #fff;
    }
    .quality-list {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      max-height: 240px;
      overflow-y: auto;
    }
    .quality-item {
      background: rgba(26, 26, 46, 0.6);
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 0.6rem 0.8rem;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .quality-tag {
      background: rgba(168, 85, 247, 0.3);
      color: #f3e8ff;
      font-family: monospace;
      font-weight: 700;
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      border-radius: 0.4rem;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .notice-box {
      background: rgba(139, 92, 246, 0.1);
      border: 1px solid rgba(139, 92, 246, 0.2);
      border-radius: 0.75rem;
      padding: 0.6rem 0.8rem;
      font-size: 0.72rem;
      color: #d8b4fe;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <div class="player-wrapper">
    <!-- Info Bar -->
    <div class="info-bar">
      <div>
        <span class="info-title" id="animeTitle">Naruto Shippūden (Hindi Dubbed)</span>
        <span class="info-meta">•</span>
        <span style="color: #d1d5db;" id="episodeInfo">Season 18 • Episode 1</span>
      </div>
      <span class="badge" id="qualityBadge">HD 720p</span>
    </div>

    <!-- Video Container -->
    <div class="video-container">
      <video id="videoPlayer" playsinline></video>

      <!-- Loading Overlay -->
      <div class="loading-overlay" id="loadingOverlay">
        <div class="spinner"></div>
        <p style="margin-top: 0.5rem; font-size: 0.8rem; color: #d8b4fe;" id="loadingText">Resolving Stream...</p>
      </div>

      <!-- Control Bar -->
      <div class="controls-overlay">
        <div style="display: flex; gap: 0.5rem;">
          <button class="btn" id="playBtn"><i class="fa-solid fa-play"></i> Play</button>
        </div>

        <div style="display: flex; gap: 0.5rem; align-items: center;">
          <button class="btn btn-gradient" id="downloadModalTrigger">
            <i class="fa-solid fa-download"></i> Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Quality Download Modal -->
  <div class="modal-backdrop" id="downloadModal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">
          <i class="fa-solid fa-cloud-arrow-down" style="color: #ec4899;"></i> Download Episode
        </div>
        <button class="close-btn" id="closeModalBtn">&times;</button>
      </div>

      <div id="modalContent">
        <!-- Dynamic Quality List populated via JS -->
      </div>

      <div class="notice-box">
        <i class="fa-solid fa-sparkles" style="color: #ec4899;"></i>
        <strong>Blakite High-Speed CDN:</strong> Download direct segment package (.tar) or copy URL into IDM, 1DM, ADM, or VLC Media Player.
      </div>
    </div>
  </div>

  <script>
    // Configuration & State
    const TMDB_ID = "31910";
    const SEASON = 18;
    const EPISODE = 1;
    const STREAM_API = `https://anime-api-new.antideploy.app/api/resolve/blakite/${TMDB_ID}/${SEASON}-${EPISODE}`;
    const DOWNLOAD_API = `https://anime-api-new.antideploy.app/api/download/blakite/${TMDB_ID}/${SEASON}/${EPISODE}`;

    const video = document.getElementById('videoPlayer');
    const playBtn = document.getElementById('playBtn');
    const loadingOverlay = document.getElementById('loadingOverlay');
    const loadingText = document.getElementById('loadingText');

    const downloadModal = document.getElementById('downloadModal');
    const downloadModalTrigger = document.getElementById('downloadModalTrigger');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const modalContent = document.getElementById('modalContent');

    let hls = null;

    // Load Streaming Source
    async function initStream() {
      loadingOverlay.style.display = 'flex';
      loadingText.textContent = 'Resolving Stream...';

      try {
        const res = await fetch(STREAM_API);
        const data = await res.json();
        
        if (data.status && data.video_url) {
          if (data.animeTitle) document.getElementById('animeTitle').textContent = data.animeTitle;

          if (data.video_url.includes('.m3u8') && Hls.isSupported()) {
            if (hls) hls.destroy();
            hls = new Hls({ maxBufferLength: 30 });
            hls.loadSource(data.video_url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
              loadingOverlay.style.display = 'none';
            });
          } else {
            video.src = data.video_url;
            loadingOverlay.style.display = 'none';
          }
        } else {
          loadingText.textContent = data.error || 'Failed to resolve video stream.';
        }
      } catch (err) {
        loadingText.textContent = 'Error connecting to streaming server.';
      }
    }

    // Play/Pause Handler
    playBtn.addEventListener('click', () => {
      if (video.paused) {
        video.play();
        playBtn.innerHTML = '<i class="fa-solid fa-pause"></i> Pause';
      } else {
        video.pause();
        playBtn.innerHTML = '<i class="fa-solid fa-play"></i> Play';
      }
    });

    // Quality Download Modal Trigger
    downloadModalTrigger.addEventListener('click', async () => {
      downloadModal.classList.add('active');
      modalContent.innerHTML = `
        <div style="text-align: center; padding: 1.5rem;">
          <div class="spinner" style="margin: 0 auto;"></div>
          <p style="font-size: 0.8rem; margin-top: 0.5rem; color: #c084fc;">Fetching quality download links...</p>
        </div>
      `;

      try {
        const res = await fetch(DOWNLOAD_API);
        const data = await res.json();

        if (data.status && data.downloads) {
          const qualities = data.available_qualities || Object.keys(data.downloads);
          let html = '<div class="quality-list">';

          qualities.forEach(q => {
            const url = data.downloads[q];
            if (!url) return;
            html += `
              <div class="quality-item">
                <span class="quality-tag">${q}</span>
                <div style="display: flex; gap: 0.4rem;">
                  <button class="btn" onclick="copyLink('${url}', this)">
                    <i class="fa-solid fa-copy"></i> Copy
                  </button>
                  <button class="btn btn-gradient" onclick="initiateDownload('${q}', '${url}', this)">
                    <i class="fa-solid fa-download"></i> Download
                  </button>
                </div>
              </div>
            `;
          });
          html += '</div><div id="downloadNotice" style="margin-top:0.5rem; display:none; padding:0.5rem 0.75rem; border-radius:0.5rem; font-size:0.75rem;"></div>';
          modalContent.innerHTML = html;
        } else {
          modalContent.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem; text-align: center;">${data.error || 'No download links found.'}</p>`;
        }
      } catch (err) {
        modalContent.innerHTML = `<p style="color: #ef4444; font-size: 0.85rem; text-align: center;">Network error fetching download links.</p>`;
      }
    });

    closeModalBtn.addEventListener('click', () => downloadModal.classList.remove('active'));
    downloadModal.addEventListener('click', (e) => {
      if (e.target === downloadModal) downloadModal.classList.remove('active');
    });

    function copyLink(url, btnElement) {
      navigator.clipboard.writeText(url);
      const originalText = btnElement.innerHTML;
      btnElement.innerHTML = '<i class="fa-solid fa-check" style="color: #4ade80;"></i> Copied';
      setTimeout(() => {
        btnElement.innerHTML = originalText;
      }, 2000);
    }

    async function initiateDownload(q, url, btnElement) {
      const originalText = btnElement.innerHTML;
      btnElement.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Processing';
      const notice = document.getElementById('downloadNotice');
      
      const updateNotice = (msg, isSuccess = false) => {
        if (!notice) return;
        notice.style.display = 'block';
        notice.style.background = isSuccess ? 'rgba(34,197,94,0.15)' : 'rgba(168,85,247,0.15)';
        notice.style.color = isSuccess ? '#4ade80' : '#e9d5ff';
        notice.style.border = isSuccess ? '1px solid rgba(34,197,94,0.3)' : '1px solid rgba(168,85,247,0.3)';
        notice.innerHTML = msg;
      };

      const blakitePageUrl = `https://blakiteapi.xyz/download.php?id=${encodeURIComponent(TMDB_ID)}&season=${encodeURIComponent(SEASON)}&episode=${encodeURIComponent(EPISODE)}`;

      try {
        updateNotice(`Analyzing M3U8 video segments for ${q}...`);
        const playlistRes = await fetch(url);
        if (!playlistRes.ok) throw new Error(`HTTP ${playlistRes.status}`);
        const playlistText = await playlistRes.text();
        if (playlistText.trim().startsWith('<')) throw new Error('Invalid playlist');

        const lines = playlistText.split('\n').map(l => l.trim()).filter(l => l && !l.startsWith('#'));
        if (lines.length === 0) throw new Error('No segments');

        const baseUrl = url.slice(0, url.lastIndexOf('/') + 1);
        const segmentUrls = lines.map(l => l.startsWith('http') ? l : baseUrl + l);

        updateNotice(`Downloading ${segmentUrls.length} video segments for ${q}...`);

        const segments = new Array(segmentUrls.length).fill(null);
        let downloadedCount = 0;
        let totalBytes = 0;
        const BATCH_SIZE = 5;

        for (let i = 0; i < segmentUrls.length; i += BATCH_SIZE) {
          const batch = segmentUrls.slice(i, i + BATCH_SIZE).map((segUrl, idx) => ({ segUrl, index: i + idx }));
          const results = await Promise.all(batch.map(async ({ segUrl, index }) => {
            try {
              const r = await fetch(segUrl);
              if (!r.ok) return { index, data: null };
              const buf = await r.arrayBuffer();
              return { index, data: new Uint8Array(buf) };
            } catch {
              return { index, data: null };
            }
          }));

          results.forEach(res => {
            if (res.data) {
              segments[res.index] = res.data;
              downloadedCount++;
              totalBytes += res.data.byteLength;
            }
          });

          const pct = Math.round((downloadedCount / segmentUrls.length) * 90);
          const mb = (totalBytes / (1024 * 1024)).toFixed(1);
          updateNotice(`Downloading ${q} segments: ${downloadedCount}/${segmentUrls.length} (${pct}%) • ${mb} MB`);
        }

        if (segments.includes(null)) throw new Error('Some segments failed');

        updateNotice(`Merging ${segments.length} video segments into .mp4 video file...`);

        const totalSize = segments.reduce((acc, s) => acc + (s ? s.length : 0), 0);
        const mergedVideo = new Uint8Array(totalSize);
        let offset = 0;
        for (const seg of segments) {
          if (seg) {
            mergedVideo.set(seg, offset);
            offset += seg.length;
          }
        }

        const videoBlob = new Blob([mergedVideo.buffer], { type: 'video/mp4' });
        const blobUrl = URL.createObjectURL(videoBlob);
        const filename = `ANIZENX_Episode_S${SEASON}E${EPISODE}_${q}.mp4`;

        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 15000);

        const finalMb = (totalSize / (1024 * 1024)).toFixed(1);
        updateNotice(`✓ Download Complete! Assembled ${q} video file (${finalMb} MB). Saved as ${filename}`, true);
      } catch (err) {
        copyLink(url, btnElement);
        updateNotice(`📋 Direct link copied for ${q}! Browser CORS prevented direct segment assembly. <a href="${blakitePageUrl}" target="_blank" style="color: #ec4899; font-weight: bold; text-decoration: underline;">Open Blakite Process Page</a> or use IDM / 1DM / VLC.`);
      } finally {
        setTimeout(() => {
          btnElement.innerHTML = originalText;
        }, 1500);
      }
    }

    // Initialize Stream on Page Load
    initStream();
  </script>
</body>
</html>
